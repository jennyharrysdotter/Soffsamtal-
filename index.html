<title>Soffsamtal</title>

<style>
/* Layout: one-screen card table — mode switch + chips on top, one card centered, draw button at thumb height.

:root {
  --bg: #f4c6d3; --bg-2: #f9dbe4;

  --ink: #3a0f17; --accent: #2337c6;

  --body: "Figtree", system-ui, -apple-system, sans-serif;
  --q-weight: 400;
  color-scheme: light;
}
:root[data-mode="vanner"] {
  --bg: #c9dcf6; --bg-2: #e1ecfb;
  --frame: #1f3fbf; --frame-deep: #142a85;
  --face: #fff7dc; --face-alt: #ffd65c;
  --txt: #1f3fbf; --inv-txt: #ffd65c;
  --ink: #0f1a45; --accent: #e5462e;
  --q-font: "Figtree", system-ui, sans-serif;
  --q-weight: 800;
}
:root[data-mode="familj"] {
  --bg: #d3e8c8; --bg-2: #e6f2df;
  --frame: #2e7a46; --frame-deep: #1d5530;
  --face: #fffaea; --face-alt: #ffbf73;
  --txt: #2e7a46; --inv-txt: #fffaea;
  --ink: #12301c; --accent: #d9531e;
  --q-font: "Figtree", system-ui, sans-serif;
  --q-weight: 700;
}
:root[data-mode="familj"] .card { border-radius: 28px; }
:root[data-mode="familj"] .face { border-radius: 18px; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; transition: background .4s; }
.app {
  min-height: 100%; box-sizing: border-box; max-width: 480px; margin: 0 auto;
  padding-inline: 16px; padding-block: 14px 20px;
  display: flex; flex-direction: column; gap: 12px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 1.5rem; margin: 0; color: var(--frame-deep); line-height: 1.1; }

.count { font-size: .8rem; font-weight: 600; color: var(--frame-deep); font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--bg-2); padding: 6px 10px; border-radius: 999px; }

.modes { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg-2); border-radius: 14px; padding: 4px; gap: 4px; }
.mode { font: 700 .95rem var(--body); border: 0; border-radius: 10px; padding: 10px; background: transparent; color: var(--frame-deep); cursor: pointer; }
.mode[aria-pressed="true"] { background: var(--frame); color: var(--face); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 600 .85rem var(--body); color: var(--frame-deep); background: var(--bg-2); border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--frame); color: var(--face); }
button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.stage { flex: 1; display: grid; place-items: center; min-height: 300px; }
.card {
  --c-face: var(--face); --c-frame: var(--frame); --c-txt: var(--txt);
  width: 100%; max-width: 100%; aspect-ratio: 5 / 7; max-height: 56vh; box-sizing: border-box;
  background: var(--c-frame); border-radius: 20px; padding: 16px;
  box-shadow: 0 22px 40px -22px color-mix(in srgb, var(--frame-deep) 70%, transparent);
  transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.card.alt { --c-face: var(--face-alt); }
.card.inv { --c-face: var(--frame); --c-frame: var(--face-alt); --c-txt: var(--inv-txt); }
:root[data-mode="vanner"] .card { border-radius: 10px; }
:root[data-mode="vanner"] .face { border-radius: 4px; }
.face {
  height: 100%; box-sizing: border-box; background: var(--c-face); border-radius: 12px;
  outline: 2px dashed color-mix(in srgb, var(--c-frame) 55%, var(--c-face)); outline-offset: -9px;
  display: flex; flex-direction: column; padding: 22px 20px; color: var(--c-txt);
}
.card.out { transform: translateX(-30px) rotate(-6deg); opacity: 0; }
.card.in { transform: translateX(30px) rotate(5deg); opacity: 0; transition: none; }
.cat { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; text-align: center; opacity: .8; }
.q {
  flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--q-font); font-weight: var(--q-weight); font-size: clamp(1.3rem, 6vw, 1.75rem); line-height: 1.28; text-wrap: balance; padding: 6px 4px;
}
.mark { text-align: center; font-size: 1.15rem; line-height: 1; font-weight: 800; }

.starter { min-height: 1.4em; text-align: center; font-weight: 700; color: var(--frame-deep); font-size: .95rem; }
.actions { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; }
.draw { font: 700 1.05rem var(--body); padding: 17px; border: 0; border-radius: 16px; background: var(--frame); color: var(--face); box-shadow: 0 4px 0 var(--frame-deep); cursor: pointer; }
.draw:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--frame-deep); }
.ghost { font: 600 1rem var(--body); padding: 0 16px; border-radius: 16px; background: var(--bg-2); color: var(--frame-deep); border: 0; cursor: pointer; }
.ghost:disabled { opacity: .4; cursor: default; }
.foot { font-size: .8rem; color: var(--frame-deep); text-align: center; opacity: .85; }
.foot button { background: none; border: 0; color: var(--accent); font: 600 .8rem var(--body); text-decoration: underline; padding: 4px; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { .card, .card.out, .card.in { transition: none; transform: none; } body { transition: none; } }
</style>
</head>

        "Vem här skulle vara sämst på att hålla en hemlighet?",
        "Vilken kändis har du blivit förväxlad med?"
      ],
      "Heta stolen": [
        "Vad uppskattar du mest hos personen till höger om dig?",
        "Vilken är din mest kontroversiella matåsikt?",
        "Vad är något du aldrig har vågat erkänna här?",
        "Vilken åsikt har du som de flesta här inte delar?",
        "Vem här har lärt dig något viktigt, och vad?",
        "Vad tycker du att vi borde göra oftare tillsammans?",
        "Vilket första intryck hade du av någon här som visade sig vara fel?",
        "Vilken komplimang skulle du ge var och en här?",
        "Vad är du hemligt bra på?",
        "Vad skulle du ändra på i ditt liv om du var helt ärlig?",
        "Vilken är den största lögnen du har kommit undan med?",
        "Vem här ringer du först när något går snett?"
      ]
    }
  }
};

const ALL = "Alla";
const $ = id => document.getElementById(id);
const cardEl = $("card"), chips = $("chips");
let mode = "par", active = ALL, pile = [], history = [], pos = -1;
try { const m = localStorage.getItem("soffsamtal-mode"); if (m && MODES[m]) mode = m; } catch (e) {}

const M = () => MODES[mode];
function build() {
  const d = M().deck, src = active === ALL ? Object.keys(d) : [active];
  pile = src.flatMap(c => d[c].map(q => ({ c, q })));
  for (let i = pile.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pile[i], pile[j]] = [pile[j], pile[i]]; }
  history = []; pos = -1; update();
}
function update() {
  $("count").textContent = pile.length ? `${pile.length} kvar` : "Slut på kort";
  $("back").disabled = pos <= 0;
  $("draw").textContent = pile.length || pos < history.length - 1 ? "Dra ett kort" : "Blanda och börja om";
}
function paint(item) {
  cardEl.className = "card " + (M().style[item.c] || "");
  $("cat").textContent = item.c; $("q").textContent = item.q;
  $("starter").textContent = "";
}
function show(item) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { paint(item); return; }
  cardEl.classList.add("out");
  setTimeout(() => { paint(item); cardEl.classList.add("in"); void cardEl.offsetWidth; cardEl.classList.remove("in"); }, 260);
}
function draw() {
  if (pos < history.length - 1) { pos++; show(history[pos]); update(); return; }
  if (!pile.length) build();
  const item = pile.pop(); history.push(item); pos = history.length - 1;
  show(item); update();
}
function back() { if (pos > 0) { pos--; show(history[pos]); update(); } }

function renderChips() {
  chips.innerHTML = "";
  [ALL, ...Object.keys(M().deck)].forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.id = `chip-${mode}-${i}`; b.textContent = c;
    b.setAttribute("aria-pressed", c === active);
    b.onclick = () => {
      active = c;
      chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
      build(); draw();
    };
    chips.appendChild(b);
  });
}
function setMode(m, animate) {
  mode = m; active = ALL;
  try { localStorage.setItem("soffsamtal-mode", m); } catch (e) {}
  document.documentElement.dataset.mode = m;
  document.querySelector('meta[name="theme-color"]').content = M().theme;
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  $("sub").textContent = M().sub; $("mark").textContent = M().mark;
  $("foot").firstChild.textContent = M().foot + " ";
  renderChips(); build();
  const item = pile.pop(); history.push(item); pos = 0;
  animate ? show(item) : paint(item); update();
}

document.querySelectorAll(".mode").forEach(b => b.onclick = () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode, true); });
$("draw").onclick = draw;
$("back").onclick = back;
$("reset").onclick = () => { build(); draw(); };
$("who").onclick = () => { const o = M().who; $("starter").textContent = o[Math.floor(Math.random() * o.length)]; };
setMode(mode, false);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
