<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4c6d3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Soffsamtal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen card table for two — category chips, one card centered, draw button at thumb height. Single deliberate rosé look. */
:root {
  --bg: #f4c6d3;         /* rosé bord */
  --bg-2: #f9dbe4;
  --red: #d42a3c;        /* kortröd */
  --red-deep: #a51d2d;
  --cream: #fff3dc;      /* kortpapper */
  --pink: #f7b3c8;
  --blue: #2337c6;       /* liten kontrast i detaljer */
  --ink: #3a0f17;
  --display: "Young Serif", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; }
.app {
  min-height: 100%; box-sizing: border-box; max-width: 480px; margin: 0 auto;
  padding-inline: 16px; padding-block: 16px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; color: var(--red-deep); line-height: 1.1; }
h1 small { display: block; font-family: var(--body); font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin-top: 3px; }
.count { font-size: .8rem; font-weight: 600; color: var(--red-deep); font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--bg-2); padding: 6px 10px; border-radius: 999px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: 600 .85rem var(--body); color: var(--red-deep);
  background: var(--bg-2); border: 1.5px solid transparent; border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--red); color: var(--cream); }
.chip:focus-visible, button:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; }

.stage { flex: 1; display: grid; place-items: center; min-height: 330px; }
.card {
  --face: var(--cream); --frame: var(--red); --txt: var(--red);
  width: 100%; max-width: 100%; aspect-ratio: 5 / 7; max-height: 60vh; box-sizing: border-box;
  background: var(--frame); border-radius: 20px; padding: 16px;
  box-shadow: 0 22px 40px -22px #7a1424aa;
  transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.card.alt { --face: var(--pink); }
.card.inv { --face: var(--red); --frame: var(--pink); --txt: var(--cream); }
.face {
  height: 100%; box-sizing: border-box; background: var(--face); border-radius: 12px;
  outline: 2px dashed color-mix(in srgb, var(--frame) 55%, var(--face)); outline-offset: -9px;
  display: flex; flex-direction: column; padding: 22px 20px; color: var(--txt);
}
.card.out { transform: translateX(-30px) rotate(-6deg); opacity: 0; }
.card.in { transform: translateX(30px) rotate(5deg); opacity: 0; transition: none; }
.cat { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; text-align: center; opacity: .8; }
.q {
  flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--display); font-size: clamp(1.35rem, 6.2vw, 1.8rem); line-height: 1.3; text-wrap: balance; padding: 6px 4px;
}
.mark { text-align: center; font-size: 1.1rem; line-height: 1; }

.starter { min-height: 1.4em; text-align: center; font-weight: 600; color: var(--red-deep); font-size: .95rem; }
.actions { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; }
button { font-family: var(--body); cursor: pointer; border-radius: 16px; }
.draw { font-size: 1.05rem; font-weight: 700; padding: 17px; border: 0; background: var(--red); color: var(--cream); box-shadow: 0 4px 0 var(--red-deep); }
.draw:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-deep); }
.ghost { font-size: 1rem; font-weight: 600; padding: 0 16px; background: var(--bg-2); color: var(--red-deep); border: 0; }
.ghost:disabled { opacity: .4; cursor: default; }
.foot { font-size: .8rem; color: var(--red-deep); text-align: center; opacity: .85; }
.foot button { background: none; border: 0; color: var(--blue); font-weight: 600; font-size: .8rem; text-decoration: underline; padding: 4px; }

@media (prefers-reduced-motion: reduce) { .card, .card.out, .card.in { transition: none; transform: none; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Soffsamtal<small>för två</small></h1>
    <span class="count" id="count"></span>
  </header>

  <nav class="chips" id="chips" aria-label="Kategori"></nav>

  <main class="stage">
    <article class="card" id="card" aria-live="polite">
      <div class="face">
        <div class="cat" id="cat">Vi två</div>
        <div class="q" id="q">Vilket ögonblick ur vår första tid tänker du oftast på?</div>
        <div class="mark" aria-hidden="true">♡</div>
      </div>
    </article>
  </main>

  <div class="starter" id="starter" aria-live="polite"></div>
  <div class="actions">
    <button class="ghost" id="back" disabled aria-label="Föregående kort">←</button>
    <button class="draw" id="draw">Dra ett kort</button>
    <button class="ghost" id="who" aria-label="Lotta vem som börjar">Vem börjar?</button>
  </div>
  <div class="foot">Ni svarar båda på samma kort. <button id="reset">Blanda om</button></div>
</div>

<script>
const DECK = {
  "Vi två": [
    "Vilket ögonblick ur vår första tid tänker du oftast på?",
    "När kände du att det här var på riktigt mellan oss?",
    "Vilken av våra resor eller utflykter skulle du vilja göra om?",
    "Vad är vårt bästa internskämt, och hur började det?",
    "När var vi som bäst som lag?",
    "Vilken svår period tycker du att vi tog oss igenom bra?",
    "Vad gjorde jag första gången som fick dig att bli intresserad?",
    "Vilken vanlig kväll med oss minns du som extra fin?",
    "Vad har vi blivit bättre på sedan vi träffades?",
    "Vilket foto på oss tycker du mest om, och varför?",
    "Vilken plats känns som vår plats?",
    "Vad tror du andra ser när de ser oss tillsammans?"
  ],
  "Lär känna": [
    "Vad i din uppväxt har format dig mest?",
    "Vad gör dig nervös som du sällan berättar?",
    "Vilken egenskap hos dig själv är du mest stolt över?",
    "Vad behöver du när du har haft en dålig dag?",
    "Vilken dröm hade du förr som du har släppt?",
    "Vad får dig att känna dig mest älskad?",
    "Vad har du ändrat åsikt om de senaste åren?",
    "Vilken vän eller släkting har betytt mest för dig, och varför?",
    "Vad skulle tolvåriga du tycka om livet du har nu?",
    "Vad är du rädd att missa i livet?",
    "När känner du dig som mest fri?",
    "Vad önskar du att fler frågade dig om?"
  ],
  "Vardag & mys": [
    "Vad är det mysigaste vi har gjort den senaste tiden?",
    "Vilken liten sak gör jag i vardagen som du uppskattar?",
    "Hur ser vår perfekta lediga söndag ut?",
    "Vilken middag ska vi laga ihop snart?",
    "Vilken syssla hemma skulle du gärna byta bort, och mot vad?",
    "Vad skulle göra våra vardagskvällar lite bättre?",
    "Vilken serie eller film har varit bäst att se tillsammans?",
    "Vilken rutin hos oss vill du aldrig ska försvinna?",
    "Vad gör du när du vill visa mig omtanke utan ord?",
    "Vad ska vi sluta stressa över?",
    "Vilken årstid är bäst för oss, och vad gör vi då?",
    "Vad har du skrattat mest åt den här veckan?"
  ],
  "Drömmar": [
    "Var tror du att vi bor om tio år, och hur ser det ut?",
    "Vilket äventyr vill du att vi gör tillsammans?",
    "Vad vill du att vi ska ha hunnit med till nästa sommar?",
    "Vilken tradition vill du att vi startar?",
    "Om vi fick ett år ledigt med full lön, vad gör vi?",
    "Vad vill du lära dig, och kan jag hjälpa till?",
    "Vilket land eller vilken stad vill du att vi upptäcker ihop?",
    "Hur vill du att vi firar nästa stora högtid?",
    "Vad är en liten dröm du har som vi kan göra av redan i år?",
    "Vad vill du att vi ska vara kända för bland våra vänner?",
    "Hur vill du att vi har det när vi är gamla?",
    "Vad vill du göra mer av och mindre av ihop framöver?"
  ],
  "Närhet": [
    "När känner du dig mest nära mig?",
    "Vilken beröring tycker du mest om i vardagen?",
    "Vad är det mest romantiska jag har gjort?",
    "När tycker du att jag är som mest attraktiv?",
    "Vad skulle du vilja att vi gjorde oftare när vi är nära?",
    "Vilken kyss minns du bäst?",
    "Vad får dig att känna dig trygg med mig?",
    "Vad är en perfekt dejt för dig, från början till slut?",
    "Finns det något nytt du är nyfiken på att vi testar?",
    "Hur vill du helst att jag visar att jag vill ha dig?",
    "Vilket kompliment från mig minns du?",
    "Vad gör att du kan slappna av helt med mig?"
  ],
  "Skratt": [
    "Vad var vår pinsammaste stund tillsammans?",
    "Vilken av mina vanor skulle bli en bra sketch?",
    "Om vi var ett band, vad skulle vi heta?",
    "Vilket djur är jag, och vilket är du?",
    "Vem av oss skulle klara sig längst på en öde ö?",
    "Vad är det dummaste vi har bråkat om?",
    "Vilken kändis skulle spela mig i filmen om oss?",
    "Vilken av mina rätter borde aldrig lagas igen?",
    "Vad skulle vår dokusåpa heta?",
    "Vilket ord eller uttryck säger jag för ofta?",
    "Vilket misslyckat projekt hemma minns du med glädje?",
    "Om vi bytte liv i en dag, vad gör du först?"
  ]
};

const ALL = "Alla";
const cats = [ALL, ...Object.keys(DECK)];
const STYLE = { "Vi två": "", "Lär känna": "alt", "Vardag & mys": "", "Drömmar": "alt", "Närhet": "inv", "Skratt": "alt" };
let active = ALL, pile = [], history = [], pos = -1;

const $ = id => document.getElementById(id);
const cardEl = $("card"), chips = $("chips");

function total() { return active === ALL ? Object.values(DECK).flat().length : DECK[active].length; }
function build() {
  const src = active === ALL ? Object.keys(DECK) : [active];
  pile = src.flatMap(c => DECK[c].map(q => ({ c, q })));
  for (let i = pile.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pile[i], pile[j]] = [pile[j], pile[i]]; }
  history = []; pos = -1; update();
}
function update() {
  $("count").textContent = pile.length ? `${pile.length} kvar` : "Slut på kort";
  $("back").disabled = pos <= 0;
  $("draw").textContent = pile.length || pos < history.length - 1 ? "Dra ett kort" : "Blanda och börja om";
}
function paint(item) {
  cardEl.className = "card " + (STYLE[item.c] || "");
  $("cat").textContent = item.c; $("q").textContent = item.q;
  $("starter").textContent = "";
}
function show(item) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { paint(item); return; }
  cardEl.classList.add("out");
  setTimeout(() => {
    paint(item); cardEl.classList.add("in");
    void cardEl.offsetWidth; cardEl.classList.remove("in");
  }, 260);
}
function draw() {
  if (pos < history.length - 1) { pos++; show(history[pos]); update(); return; }
  if (!pile.length) build();
  const item = pile.pop(); history.push(item); pos = history.length - 1;
  show(item); update();
}
function back() { if (pos > 0) { pos--; show(history[pos]); update(); } }

cats.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "chip"; b.id = "chip-" + i; b.textContent = c;
  b.setAttribute("aria-pressed", c === active);
  b.onclick = () => {
    active = c;
    chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
    build(); draw();
  };
  chips.appendChild(b);
});
$("draw").onclick = draw;
$("back").onclick = back;
$("reset").onclick = () => { build(); draw(); };
$("who").onclick = () => {
  const opts = ["Du börjar", "Din partner börjar", "Den som är yngst börjar", "Den som drog kortet börjar", "Den som log först börjar"];
  $("starter").textContent = opts[Math.floor(Math.random() * opts.length)];
};
build();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body>
</html>
